<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Center Artwork -->
  <circle cx="400" cy="220" r="70" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.2)" stroke-width="2" />
  <circle cx="400" cy="220" r="50" fill="rgba(245, 158, 11, 0.12)" />

  <!-- Image Icon Graphic -->
  <g transform="translate(376, 196)" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="48" height="48" rx="8" stroke="url(#goldGradient)" />
    <circle cx="16" cy="16" r="4" fill="url(#goldGradient)" />
    <path d="M4 36 L18 22 L28 32 L36 24 L44 32" stroke="url(#goldGradient)" />
  </g>

  <!-- Text / Label -->
  <text x="400" y="325" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    معاينة المشروع الإبداعي
  </text>
  <text x="400" y="355" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Creative Portfolio Project
  </text>
</svg>
